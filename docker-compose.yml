services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: book_lending_test
      MYSQL_USER: app
      MYSQL_PASSWORD: app_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DB_HOST: db
      DB_NAME: book_lending_test
      TOKEN_TTL_SECONDS: "2"
      BASE_URL: http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      - db
