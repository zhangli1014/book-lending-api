{% extends "base.html" %}
{% block title %}Log in · Book Lending{% endblock %}
{% block content %}
<section>
  <h2>Log in</h2>
  <form id="login-form" data-testid="login-form">
    <label>Username
      <input id="username" name="username" data-testid="username-input" required minlength="3">
    </label>
    <label>Password
      <input id="password" name="password" type="password" data-testid="password-input" required>
    </label>
    <button type="submit" data-testid="login-button">Log in</button>
    <button type="button" id="register-button" data-testid="register-button">Register</button>
  </form>
</section>
{% endblock %}
